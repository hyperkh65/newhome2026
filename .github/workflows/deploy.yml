name: Deploy to NAS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare NAS directory
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          script_stop: false
          script: |
            mkdir -p /volume1/web/newhome2026
            exit 0

      - name: Copy build to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          source: ".next/standalone/,.next/static/,public/"
          target: /volume1/web/newhome2026/

      - name: Deploy on NAS
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script_stop: false
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node

            mkdir -p /volume1/web/newhome2026/.next/standalone/.next

            cp -r /volume1/web/newhome2026/.next/static /volume1/web/newhome2026/.next/standalone/.next/static 2>/dev/null
            cp -r /volume1/web/newhome2026/public /volume1/web/newhome2026/.next/standalone/public 2>/dev/null

            kill $(cat /tmp/newhome.pid 2>/dev/null) 2>/dev/null
            fuser -k 3102/tcp 2>/dev/null || true

            PORT=3102 $NODE /volume1/web/newhome2026/.next/standalone/server.js >> /tmp/newhome.log 2>&1 &
            echo $! > /tmp/newhome.pid
            echo "Started PID=$(cat /tmp/newhome.pid) on port 3102"
            exit 0
