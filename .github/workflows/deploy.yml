name: Deploy to NAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_ID: ${{ secrets.NEXT_PUBLIC_ADMIN_ID }}
          NEXT_PUBLIC_ADMIN_PW: ${{ secrets.NEXT_PUBLIC_ADMIN_PW }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
        run: npm run build

      - name: Prepare NAS directory
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /volume1/web/newhome2026

      - name: Copy build to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          source: ".next/standalone/,.next/static/,public/"
          target: /volume1/web/newhome2026/

      - name: Deploy on NAS
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            NODE=/volume1/homes/urjent/runtime/node-v22.16.0-linux-x64/bin/node
            mkdir -p /volume1/web/newhome2026/.next/standalone/.next
            mkdir -p /volume1/web/newhome2026/.next/standalone/public
            rm -rf /volume1/web/newhome2026/.next/standalone/.next/static
            cp -r /volume1/web/newhome2026/.next/static /volume1/web/newhome2026/.next/standalone/.next/static
            cp -rp /volume1/web/newhome2026/public/. /volume1/web/newhome2026/.next/standalone/public/ 2>/dev/null || true
            OLD_PID=$(cat /tmp/newhome.pid 2>/dev/null)
            [ -n "$OLD_PID" ] && kill $OLD_PID 2>/dev/null || true
            PORT_PID=$(netstat -tlnp 2>/dev/null | grep ':3102 ' | awk '{print $NF}' | cut -d'/' -f1)
            [ -n "$PORT_PID" ] && kill $PORT_PID 2>/dev/null || true
            sleep 1
            PORT=3102 ICPA_API_KEY="${{ secrets.ICPA_API_KEY }}" $NODE /volume1/web/newhome2026/.next/standalone/server.js >> /tmp/newhome.log 2>&1 &
            echo $! > /tmp/newhome.pid
            echo "Started PID=$(cat /tmp/newhome.pid) on port 3102"